name: Build CQNhietLuyen (.NET)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish WPF application
        run: dotnet publish src/CqNl.Wpf/CqNl.Wpf.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/CQNhietLuyen

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: CQNhietLuyen-Windows-x64
          path: artifacts/CQNhietLuyen/
          if-no-files-found: error
